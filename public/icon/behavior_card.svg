<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_beh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="redstone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg_beh)"/>
  <!-- Circuit Traces / Redstone wire lines -->
  <path d="M 40,135 H 180 V 70 H 300 V 160 H 440" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,6" opacity="0.8"/>
  <circle cx="180" cy="70" r="8" fill="#ef4444"/>
  <circle cx="300" cy="160" r="8" fill="#ef4444"/>
  <circle cx="440" cy="135" r="8" fill="#ef4444"/>
  <!-- Central Mechanic Gear -->
  <g transform="translate(240, 135)">
    <circle cx="0" cy="0" r="48" fill="url(#gear)" stroke="#34d399" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#18181b"/>
    <!-- Gear teeth -->
    <rect x="-8" y="-62" width="16" height="14" fill="#10b981" rx="3"/>
    <rect x="-8" y="48" width="16" height="14" fill="#10b981" rx="3"/>
    <rect x="-62" y="-8" width="14" height="16" fill="#10b981" rx="3"/>
    <rect x="48" y="-8" width="14" height="16" fill="#10b981" rx="3"/>
    <rect x="-44" y="-44" width="14" height="14" fill="#10b981" rx="3" transform="rotate(45)"/>
    <rect x="30" y="-44" width="14" height="14" fill="#10b981" rx="3" transform="rotate(45)"/>
    <rect x="-44" y="30" width="14" height="14" fill="#10b981" rx="3" transform="rotate(45)"/>
    <rect x="30" y="30" width="14" height="14" fill="#10b981" rx="3" transform="rotate(45)"/>
  </g>
  <!-- Header Badge -->
  <rect x="24" y="24" width="140" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
  <text x="94" y="41" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BEHAVIOR ADD-ON</text>
  <text x="24" y="252" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">Entity Mechanics & Script Engine</text>
</svg>