<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_tex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg_tex)"/>
  <!-- Isometric 3D Cube / Diamond Block -->
  <g transform="translate(240, 130) scale(1.1)">
    <!-- Top Face -->
    <polygon points="0,-60 65,-25 0,10 -65,-25" fill="#38bdf8" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Left Face -->
    <polygon points="-65,-25 0,10 0,80 -65,45" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="0,10 65,-25 65,45 0,80" fill="#0369a1" stroke="#0284c7" stroke-width="2"/>
    <!-- Inner faceted details -->
    <polygon points="0,-35 35,-15 0,5 -35,-15" fill="#bae6fd" opacity="0.4"/>
    <polygon points="-35,-15 0,5 0,50 -35,30" fill="#0369a1" opacity="0.5"/>
    <polygon points="0,5 35,-15 35,30 0,50" fill="#075985" opacity="0.5"/>
  </g>
  <!-- Floating particles -->
  <circle cx="120" cy="80" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="360" cy="70" r="5" fill="#818cf8" opacity="0.7"/>
  <circle cx="390" cy="180" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="90" cy="190" r="4" fill="#38bdf8" opacity="0.4"/>
  <!-- Header Badge -->
  <rect x="24" y="24" width="135" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="91" y="41" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RESOURCE PACK</text>
  <text x="24" y="252" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold">Custom Texture & Shader Asset</text>
</svg>