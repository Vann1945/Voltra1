<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0505"/>
      <stop offset="55%" stop-color="#2a0a0a"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <linearGradient id="boltGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="35%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accentL2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgL2)"/>

  <!-- drifting storm clouds -->
  <ellipse cx="200" cy="55" rx="260" ry="65" fill="#3f0d0d" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" values="0,0; 60,0; 0,0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="28" rx="320" ry="75" fill="#3f0d0d" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" values="0,0; -80,0; 0,0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1050" cy="65" rx="280" ry="70" fill="#4a0f0f" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0; 40,0; 0,0" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- whole-scene flash -->
  <rect width="1200" height="300" fill="#fecaca">
    <animate attributeName="opacity" values="0;0;0.15;0.02;0.18;0;0;0;0;0" keyTimes="0;0.42;0.44;0.46;0.48;0.5;0.7;0.85;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- random scattered lightning bolts, varied shapes, flash independently -->
  <polygon points="150,0 128,45 148,45 118,95" fill="#fca5a5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.3;0.33;0.4;1" dur="4.2s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="410,5 385,50 405,48 370,110 420,60 398,58" fill="#f87171" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.95;0;0" keyTimes="0;0.55;0.58;0.61;0.68;1" dur="5.1s" begin="0.8s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="600,0 582,38 598,38 578,88" fill="#fecaca" opacity="0">
    <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.2;0.23;0.3;1" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="790,8 760,55 785,52 745,120 805,65 778,62" fill="#dc2626" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.9;0;0" keyTimes="0;0.68;0.71;0.74;0.8;1" dur="4.7s" begin="0.3s" repeatCount="indefinite"/>
  </polygon>

  <polygon points="240,20 222,58 236,58 214,100" fill="#f87171" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.45;0.48;0.55;1" dur="5.6s" begin="2.4s" repeatCount="indefinite"/>
  </polygon>

  <!-- main bolt, static -->
  <g transform="translate(985,20)">
    <polygon points="100,0 40,125 82,125 25,250 150,105 92,105" fill="url(#boltGrad2)"/>
  </g>

  <!-- accent line -->
  <rect x="80" y="96" width="64" height="6" rx="3" fill="url(#accentL2)"/>

  <!-- title -->
  <text x="80" y="158" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#fafaf9" letter-spacing="0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,14; 0,0" dur="0.8s" begin="0.1s" fill="freeze" additive="sum"/>
    Voltra Marketplace
  </text>

  <!-- subtitle -->
  <text x="80" y="192" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#d6d3d1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.35s" fill="freeze"/>
    A community marketplace for Minecraft add-ons, texture packs,
  </text>
  <text x="80" y="214" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#d6d3d1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.45s" fill="freeze"/>
    and resource packs — built by creators, browsed by players.
  </text>

  <!-- tech stack chips -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>

    <!-- React -->
    <rect x="80" y="236" width="108" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <g transform="translate(97,251)">
      <ellipse cx="0" cy="0" rx="11" ry="4.4" fill="none" stroke="#61dafb" stroke-width="1.6"/>
      <ellipse cx="0" cy="0" rx="11" ry="4.4" fill="none" stroke="#61dafb" stroke-width="1.6" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="11" ry="4.4" fill="none" stroke="#61dafb" stroke-width="1.6" transform="rotate(120)"/>
      <circle cx="0" cy="0" r="2.3" fill="#61dafb"/>
    </g>
    <text x="118" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">React</text>

    <!-- TypeScript -->
    <rect x="198" y="236" width="140" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <rect x="212" y="244" width="15" height="15" rx="3" fill="#3178c6"/>
    <text x="215.5" y="255.5" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#ffffff">TS</text>
    <text x="235" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">TypeScript</text>

    <!-- Vite -->
    <rect x="348" y="236" width="88" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <polygon points="366,244 373,244 370,251 376,251 364,262 367,253 362,253" fill="#facc15"/>
    <text x="379" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">Vite</text>

    <!-- Firebase -->
    <rect x="446" y="236" width="118" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <path d="M462,262 L466,244 L470,251 L474,240 L480,262 Z" fill="#f59e0b"/>
    <text x="486" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">Firebase</text>

    <!-- Node.js -->
    <rect x="574" y="236" width="112" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <polygon points="592,244 599,240 606,244 606,252 599,256 592,252" fill="#68a063"/>
    <text x="614" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">Node.js</text>

    <!-- Vercel -->
    <rect x="696" y="236" width="102" height="30" rx="5" fill="none" stroke="#3f3a35" stroke-width="1"/>
    <polygon points="717,244 724,258 710,258" fill="#fafaf9"/>
    <text x="732" y="255" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#d6d3d1">Vercel</text>
  </g>
</svg>
